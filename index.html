<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>M1 Thesis Defense — Pixel Deck</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles.css?v=1f31d95-r13" />
  </head>
  <body>
    <noscript>
      <div class="noscript">
        Ce site nécessite JavaScript pour la navigation clavier et les transitions.
      </div>
    </noscript>

    <div class="power" id="power" aria-hidden="true"></div>

    <div id="app" class="app" aria-live="polite"></div>

    <div class="deckCounter is-hidden" id="deckCounter" aria-live="polite">1</div>

    <div class="slideBeacon is-hidden" id="slideBeacon" aria-live="polite">
      <span class="slideBeacon__code" id="slideBeaconCode">w1.1</span>
      <span class="slideBeacon__name" id="slideBeaconName"></span>
    </div>

    <div class="hud is-hidden" id="hud" aria-hidden="true">
      <div class="hud__keys" id="hudKeys">← → / Enter</div>
    </div>

    <div class="crt" aria-hidden="true">
      <div class="crt__vignette"></div>
      <div class="crt__scanlines"></div>
      <div class="crt__flicker"></div>
      <div class="wipe" id="wipe"></div>
    </div>

    <script src="./script.js?v=1f31d95-r13" defer></script>
  </body>
</html>
